<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f9;
            margin:0;
        }

        .navbar{
            background:#1e3a8a;
            color:white;
            padding:15px;
            font-size:24px;
            text-align:center;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:20px;
        }

        .btn{
            background:#2563eb;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:5px;
        }

        table{
            width:100%;
            background:white;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            padding:12px;
            border:1px solid #ddd;
            text-align:left;
        }

        th{
            background:#2563eb;
            color:white;
        }

        .delete{
            background:red;
            color:white;
            padding:6px 10px;
            text-decoration:none;
            border-radius:4px;
        }
    </style>

</head>
<body>

<div class="navbar">
    Employee Management System
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
